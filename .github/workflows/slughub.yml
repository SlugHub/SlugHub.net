name: SlugHub

on:
  push:
    branches: [master]
    tags: ['SlugHub-v*']
    paths:
      - 'SlugHub/**'
      - 'Directory.Build.props'
      - '.github/workflows/_package.yml'
      - '.github/workflows/slughub.yml'
  pull_request:
    paths:
      - 'SlugHub/**'
      - 'Directory.Build.props'
      - '.github/workflows/_package.yml'
      - '.github/workflows/slughub.yml'
  workflow_dispatch:

jobs:
  package:
    uses: ./.github/workflows/_package.yml
    with:
      package: SlugHub
      project: SlugHub/src/SlugHub.csproj
      tests: SlugHub/tests/SlugHub.Tests/SlugHub.Tests.csproj

  # Trusted publishing: nuget.org has a policy for this workflow file, so no API key is stored
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SlugHub
          path: artifacts

      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
